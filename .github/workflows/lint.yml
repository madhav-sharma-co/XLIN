name: lint
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n bin/xlin lib/hyprland.sh lib/config-backups.sh install.sh update.sh scripts/files.sh scripts/deps.sh bin/xlin-dock-watch config/shell/xlin.bash tests/test-hyprland.sh tests/test-config-backups.sh tests/test-process-ownership.sh
      - name: ShellCheck (errors only)
        run: sudo apt-get install -y shellcheck && shellcheck -S error bin/xlin lib/hyprland.sh lib/config-backups.sh install.sh update.sh tests/test-hyprland.sh tests/test-config-backups.sh tests/test-process-ownership.sh
      - name: Hyprland helper regression tests
        run: bash tests/test-hyprland.sh
      - name: Config backup regression tests
        run: bash tests/test-config-backups.sh
      - name: Process ownership regression tests
        run: bash tests/test-process-ownership.sh
      - name: No duplicated functions in bin/xlin
        run: test -z "$(grep -E '^[a-z_]+\(\) \{' bin/xlin | sort | uniq -d)"
      - name: Install list consistency
        run: bash tests/test-install-lists.sh
      - name: Python compile
        run: python3 -m py_compile bin/xlin-settings bin/xlin-tools bin/xlin-files bin/xlin-welcome bin/xlin-monitor bin/xlin-terminal bin/xlin-desktop bin/xlin-store bin/xlin-media bin/xlin-debug bin/xlin-start lib/xlin_ui.py scripts/make-cursors.py scripts/make-icons.py scripts/make-wallpapers.py
