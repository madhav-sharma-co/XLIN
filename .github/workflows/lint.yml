name: lint
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: bash -n bin/xlin install.sh update.sh config/shell/xlin.bash
      - name: ShellCheck (errors only)
        run: sudo apt-get install -y shellcheck && shellcheck -S error bin/xlin install.sh update.sh
      - name: Python compile
        run: python3 -m py_compile bin/xlin-settings bin/xlin-tools bin/xlin-files bin/xlin-welcome bin/xlin-monitor bin/xlin-terminal bin/xlin-desktop bin/xlin-launcher bin/xlin-store bin/xlin-media bin/xlin-debug bin/xlin-start lib/xlin_ui.py scripts/make-cursors.py scripts/make-icons.py scripts/make-wallpapers.py
