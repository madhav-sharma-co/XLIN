# XLIN for Hyprland. Add to hyprland.conf:  source = ~/.config/hypr/xlin.conf
source = ~/.config/hypr/xlin-colors.conf
source = ~/.config/hypr/xlin-opacity.conf

$terminal = xlin term

# ---- autostart ----------------------------------------------------------
exec-once = xlin start
env = XCURSOR_THEME,XLIN
env = XCURSOR_SIZE,24
env = HYPRCURSOR_THEME,XLIN
env = HYPRCURSOR_SIZE,24

# ---- look: clean, rounded, smooth ----------------------------------------
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = $xlin_active
    col.inactive_border = $xlin_inactive
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 11
    # Window transparency lives in xlin-opacity.conf (change it with: xlin opacity 0.85).
    # Fullscreen windows (Super+F) are always fully opaque:
    fullscreen_opacity = 1.0
    blur {
        enabled = true
        size = 8
        passes = 3
        vibrancy = 0.15
    }
    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = $xlin_shadow
    }
}

animations {
    enabled = true
    bezier = xlinOut, 0.22, 1, 0.36, 1
    bezier = xlinSoft, 0.4, 0, 0.2, 1
    animation = windows,    1, 5, xlinOut, popin 90%
    animation = windowsOut, 1, 4, xlinSoft, popin 90%
    animation = fade,       1, 4, xlinSoft
    animation = layersIn,   1, 4, xlinOut, popin 94%
    animation = layersOut,  1, 3, xlinSoft, popin 94%
    animation = fadeLayers, 1, 4, xlinSoft
    animation = windowsMove, 1, 4, xlinOut
    animation = specialWorkspace, 1, 5, xlinOut, slidevert
    animation = workspaces, 1, 5, xlinOut, slide
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ---- blur behind bar, dock, launcher, control panel ------------------------
# Hyprland 0.53+ layer rule syntax. On older versions use:
#   layerrule = blur, waybar      layerrule = ignorealpha 0.3, waybar   (etc.)
layerrule = blur on, match:namespace ^(waybar)$
layerrule = ignore_alpha 0.3, match:namespace ^(waybar)$
layerrule = blur on, match:namespace ^(rofi)$
layerrule = ignore_alpha 0.3, match:namespace ^(rofi)$
layerrule = blur on, match:namespace ^(xlin-(launcher|start))$
layerrule = ignore_alpha 0.3, match:namespace ^(xlin-(launcher|start))$
layerrule = blur on, match:namespace ^(swaync-control-center)$
layerrule = ignore_alpha 0.3, match:namespace ^(swaync-control-center)$
layerrule = blur on, match:namespace ^(xlin-desktop)$
layerrule = ignore_alpha 0.3, match:namespace ^(xlin-desktop)$
layerrule = blur on, match:namespace ^(nwg-dock)$
layerrule = ignore_alpha 0.3, match:namespace ^(nwg-dock)$

# ---- Settings window: floating, centered, fixed size --------------------------
# (Hyprland 0.53+ syntax. Older versions: windowrulev2 = float, class:^(dev.xlin.Settings)$)
windowrule = float on, match:class ^(dev\.xlin\.Settings)$
windowrule = size 920 640, match:class ^(dev\.xlin\.Settings)$
windowrule = center on, match:class ^(dev\.xlin\.Settings)$

# ---- Tools: a small menu, plus floating calculator/calendar windows you can drag ----
# (you can drag any of them anywhere afterwards)
# The menus (Tools, battery, power) open already in place, top-right under the bar. The tools you open from
# the Tools menu (Calculator, Calendar, Notes, Screenshot) open in the middle of the screen.
windowrule = move (monitor_w-window_w-12) 46, match:class ^(dev\.xlin\.(Tools|Power|Session))$
windowrule = float on, match:class ^(dev\.xlin\.Power)$
windowrule = float on, match:class ^(dev\.xlin\.Files)$
# only the main window gets the big size, not the small rename / new-folder dialogs
windowrule = size 900 600, match:class ^(dev\.xlin\.Files)$, match:title ^(Files)$
windowrule = center on, match:class ^(dev\.xlin\.Files)$
# the "Add app shortcut" picker of the desktop
windowrule = float on, match:class ^(dev\.xlin\.Desktop)$
windowrule = size 380 520, match:class ^(dev\.xlin\.Desktop)$
windowrule = center on, match:class ^(dev\.xlin\.Desktop)$
windowrule = float on, match:class ^(dev\.xlin\.Monitor)$
windowrule = size 760 600, match:class ^(dev\.xlin\.Monitor)$
windowrule = center on, match:class ^(dev\.xlin\.Monitor)$
windowrule = float on, match:class ^(dev\.xlin\.Welcome)$
windowrule = size 600 500, match:class ^(dev\.xlin\.Welcome)$
windowrule = center on, match:class ^(dev\.xlin\.Welcome)$
windowrule = float on, match:class ^(dev\.xlin\.Session)$
windowrule = size 200 282, match:class ^(dev\.xlin\.Session)$
windowrule = size 290 300, match:class ^(dev\.xlin\.Power)$
windowrule = float on, match:class ^(dev\.xlin\.Tools)$
windowrule = size 300 320, match:class ^(dev\.xlin\.Tools)$
windowrule = float on, match:class ^(dev\.xlin\.Calculator)$
windowrule = size 300 420, match:class ^(dev\.xlin\.Calculator)$
windowrule = float on, match:class ^(dev\.xlin\.Notes)$
windowrule = size 360 470, match:class ^(dev\.xlin\.Notes)$
windowrule = float on, match:class ^(dev\.xlin\.Calendar)$
windowrule = size 340 430, match:class ^(dev\.xlin\.Calendar)$
windowrule = float on, match:class ^(dev\.xlin\.Screenshot)$
windowrule = size 300 336, match:class ^(dev\.xlin\.Screenshot)$
windowrule = center on, match:class ^(dev\.xlin\.(Calculator|Calendar|Notes|Screenshot))$

# XLIN shortcuts - every key is the first letter of what it does.
#
#   APPS                               WINDOWS
#   Super+Space   launcher             Super+Q            close window (Quit)
#   Super+Return  terminal             Super+F            fullscreen
#   Super+T       terminal (Terminal)  Super+Shift+F      floating on/off (Float)
#   Super+E       files (Explorer)     Alt+Tab            next window
#   Super+S       Settings             Super+arrows       move focus
#   Super+C       Control panel        Super+Shift+arrows move the window
#   Super+U       Utilities (tools)    Super+Ctrl+arrows  resize the window
#   Super+N       Notes (Shift: quick note)
#   Super+B       Battery menu         Super+drag         move (left) / resize (right)
#
#   SYSTEM                             WORKSPACES
#   Super+L       Lock                 Super+1..4         go to workspace
#   Super+P       Power menu           Print              screenshot (Shift: full, Alt: window)
#   Super+V       Clipboard history
#   Super+D       Dark/light toggle    Super+Shift+1..4   send window there
#   Super+W       Wallpaper (next)     Super+scroll       next/previous workspace
#   Super+/       show this list       Super+Shift+Q      quit Hyprland (log out)
#
# Remove any older binding of the same keys first (for example the default
# `SUPER, Return` from your own hyprland.conf). Without this, two binds fire
# and apps open twice.
unbind = SUPER, SPACE
unbind = SUPER, Return
unbind = SUPER, T
unbind = SUPER, E
unbind = SUPER, S
unbind = SUPER, C
unbind = SUPER, U
unbind = SUPER, B
unbind = SUPER, L
unbind = SUPER, N
unbind = SUPER SHIFT, N
unbind = SUPER, V
unbind = , Print
unbind = SHIFT, Print
unbind = ALT, Print
unbind = SUPER SHIFT, S
unbind = SUPER, P
unbind = SUPER, D
unbind = SUPER, W
unbind = SUPER, slash
unbind = SUPER, Q
unbind = SUPER, F
unbind = SUPER SHIFT, F
unbind = SUPER SHIFT, Q
unbind = ALT, Tab
unbind = SUPER, left
unbind = SUPER, right
unbind = SUPER, up
unbind = SUPER, down
unbind = SUPER SHIFT, left
unbind = SUPER SHIFT, right
unbind = SUPER SHIFT, up
unbind = SUPER SHIFT, down
unbind = SUPER CTRL, left
unbind = SUPER CTRL, right
unbind = SUPER CTRL, up
unbind = SUPER CTRL, down
unbind = SUPER, 1
unbind = SUPER, 2
unbind = SUPER, 3
unbind = SUPER, 4
unbind = SUPER SHIFT, 1
unbind = SUPER SHIFT, 2
unbind = SUPER SHIFT, 3
unbind = SUPER SHIFT, 4
unbind = SUPER, mouse_down
unbind = SUPER, mouse_up
unbind = SUPER, mouse:272
unbind = SUPER, mouse:273
unbind = , XF86AudioRaiseVolume
unbind = , XF86AudioLowerVolume
unbind = , XF86AudioMute
unbind = , XF86MonBrightnessUp
unbind = , XF86MonBrightnessDown

# ---- keybinds --------------------------------------------------------------
# Apps. (Tap-Super-alone via `bindr = SUPER, SUPER_L, ...` also fires after other
# Super shortcuts on some setups, so Super+Space is the safe default.)
bind  = SUPER, SPACE, exec, xlin launcher
bind  = SUPER, Return, exec, $terminal
bind  = SUPER, T, exec, $terminal
bind  = SUPER, E, exec, xlin files
bind  = SUPER, S, exec, xlin settings
bind  = SUPER, C, exec, xlin panel
bind  = SUPER, U, exec, xlin tools
bind  = SUPER, M, exec, xlin monitor
bind  = SUPER, H, exec, xlin unhide
# right-click on the empty desktop: small menu (new note, widgets, wallpaper, pin an app ...)
# "n" = the click still reaches the app under the pointer; xlin checks that nothing is there
bindn = , mouse:273, exec, xlin desktop-menu
bind  = SUPER, N, exec, xlin tools notes
bind  = SUPER SHIFT, N, exec, xlin note
bind  = SUPER, B, exec, xlin power

# System
bind  = SUPER, L, exec, xlin lock
bind  = SUPER, V, exec, xlin clipboard
bind  = , Print, exec, xlin screenshot region
bind  = SHIFT, Print, exec, xlin screenshot full
bind  = ALT, Print, exec, xlin screenshot window
bind  = SUPER SHIFT, S, exec, xlin screenshot region
bind  = SUPER, P, exec, xlin session
bind  = SUPER, D, exec, xlin theme toggle
bind  = SUPER, W, exec, xlin wallpaper next
bind  = SUPER, slash, exec, xlin keys menu
bind  = SUPER SHIFT, Q, exit

# Windows
bind  = SUPER, Q, killactive
bind  = SUPER, F, fullscreen, 0
bind  = SUPER SHIFT, F, togglefloating
bind  = ALT, Tab, cyclenext
bind  = ALT, Tab, bringactivetotop

bind  = SUPER, left,  movefocus, l
bind  = SUPER, right, movefocus, r
bind  = SUPER, up,    movefocus, u
bind  = SUPER, down,  movefocus, d

bind  = SUPER SHIFT, left,  movewindow, l
bind  = SUPER SHIFT, right, movewindow, r
bind  = SUPER SHIFT, up,    movewindow, u
bind  = SUPER SHIFT, down,  movewindow, d

binde = SUPER CTRL, left,  resizeactive, -40 0
binde = SUPER CTRL, right, resizeactive, 40 0
binde = SUPER CTRL, up,    resizeactive, 0 -40
binde = SUPER CTRL, down,  resizeactive, 0 40

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up,   workspace, e-1

bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

binde = , XF86AudioRaiseVolume, exec, xlin osd volume up
binde = , XF86AudioLowerVolume, exec, xlin osd volume down
bind  = , XF86AudioMute, exec, xlin osd volume mute
binde = , XF86MonBrightnessUp, exec, xlin osd brightness up
binde = , XF86MonBrightnessDown, exec, xlin osd brightness down
