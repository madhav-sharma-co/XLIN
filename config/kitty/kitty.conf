# XLIN Terminal - the complete Kitty configuration.
# Written by `xlin terminal`. Your previous config is saved as kitty.conf.xlin-backup.
# Colours, font and transparency live in the three generated files below:
#   xlin theme     -> xlin-theme.conf   (light / dark colours)
#   xlin terminal font "Name" 12 -> xlin-font.conf
#   xlin opacity 0.85            -> xlin-opacity.conf
include xlin-theme.conf
include xlin-font.conf
include xlin-opacity.conf

# ---- window ---------------------------------------------------------------
window_padding_width     14 18
window_border_width      0
hide_window_decorations  yes
remember_window_size     no
initial_window_width     100c
initial_window_height    30c
confirm_os_window_close  0
draw_minimal_borders     yes

# ---- cursor: thin and smooth -----------------------------------------------
cursor_shape             beam
cursor_beam_thickness    1.5
cursor_blink_interval    0
cursor_trail             100
cursor_trail_decay       0.1 0.4

# ---- scrolling -------------------------------------------------------------
scrollback_lines         20000
wheel_scroll_multiplier  3.0
touch_scroll_multiplier  3.0

# ---- mouse and links -------------------------------------------------------
copy_on_select           clipboard
strip_trailing_spaces    smart
mouse_hide_wait          2.0
detect_urls              yes
url_style                curly
show_hyperlink_targets   yes

# ---- quiet -----------------------------------------------------------------
enable_audio_bell        no
visual_bell_duration     0
window_alert_on_bell     no

# ---- tabs: only shown when you have more than one --------------------------
tab_bar_edge             top
tab_bar_style            fade
tab_fade                 0.25 0.5 0.75 1
tab_bar_min_tabs         2
tab_bar_margin_height    6 0
tab_title_template        {index}  {title} 
active_tab_title_template  {index}  {title} 

# ---- speed and behaviour ---------------------------------------------------
repaint_delay            8
input_delay              2
sync_to_monitor          yes
shell_integration        no-cursor
allow_remote_control     no
update_check_interval    0

# ---- keys (the kitty defaults still work: ctrl+shift+t new tab, +n new window, +c/+v copy/paste)
map ctrl+shift+equal     change_font_size all +1.0
map ctrl+shift+minus     change_font_size all -1.0
map ctrl+shift+0         change_font_size all 0
